# 对应 Grok 例程「双色球开奖次日开机更新」
# 开奖日：周二/四/日 → 次日 00:00 与 06:00 Asia/Shanghai 各更新一次
# 周一/三/五 00:00 CST = 周日/二/四 16:00 UTC → 0 16 * * 0,2,4
# 周一/三/五 06:00 CST = 周日/二/四 22:00 UTC → 0 22 * * 0,2,4
name: SSQ next-day update

on:
  schedule:
    - cron: "0 16 * * 0,2,4"
    - cron: "0 22 * * 0,2,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssq-db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot max SSQ period
        id: before
        run: |
          BEFORE=$(python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("lottery.db")
          print(c.execute("SELECT MAX(period) FROM ssq").fetchone()[0] or "")
          PY
          )
          echo "period=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Before SSQ max period: $BEFORE"

      - name: Run update_lottery.py
        run: python3 update_lottery.py

      - name: Verify SSQ database caught up
        run: |
          MAX=$(python3 - <<'PY'
          import json, sqlite3, sys
          summary = json.load(open("_update_summary.json"))["summary"]["ssq"]
          if not summary.get("ok"):
              print(f"SSQ update failed: {summary.get('error')}", file=sys.stderr)
              sys.exit(1)
          local = sqlite3.connect("lottery.db").execute("SELECT MAX(period) FROM ssq").fetchone()[0]
          remote = summary.get("api_latest")
          if remote and local and remote > local:
              print(f"SSQ still behind: db={local} api_latest={remote}", file=sys.stderr)
              sys.exit(1)
          print(local or "")
          PY
          )
          echo "SSQ max period after update: $MAX"

      - name: Refresh SSQ mingxi (recent 30)
        run: python3 update_ssq_mingxi.py --limit 30
        continue-on-error: true

      - name: Compare watch pick
        id: compare
        run: |
          python3 scripts/ssq_watch_compare.py --mode next-day --update-state --out _next_day_summary.md
          PERIOD=$(python3 -c "import json; print(json.load(open('_next_day_summary.json'))['period'])")
          ALREADY=$(python3 -c "import json; print(json.load(open('_next_day_summary.json'))['already_notified'])")
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "## 开奖次日更新"
            echo
            cat _next_day_summary.md
            echo
            echo "### update summary"
            echo '```json'
            if [ -f _update_summary.json ]; then cat _update_summary.json; else echo '{}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit DB / state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery.db _update_summary.json _next_day_notified.json _next_day_summary.md _next_day_summary.json || true
          if git diff --cached --quiet; then
            echo "No DB/state changes to commit."
          else
            PERIOD="${{ steps.compare.outputs.period }}"
            git commit -m "chore(ci): next-day update SSQ ${PERIOD} [skip ci]"
            git push
          fi
