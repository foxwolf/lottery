# /etc/nginx/conf.d/lottery.conf  (or sites-available on other distros)
# Public: http://chinasky.xicp.net:28080/  (花生壳外网 28080 → 本机 28080)
# Optional LAN :80 kept for internal use only.

upstream lottery_app {
    server 127.0.0.1:28081;
    keepalive 8;
}

server {
    listen 28080;
    listen [::]:28080;
    # Optional LAN-only HTTP (comment out if unused):
    # listen 80;
    # listen [::]:80;
    server_name chinasky.xicp.net _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://lottery_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
